<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- QR Finder Dot accent top right -->
  <rect x="44" y="10" width="10" height="10" rx="2.5" fill="#facc15" fill-opacity="0.9"/>
  <rect x="46" y="12" width="6" height="6" rx="1" fill="#052e16"/>
  <rect x="47.5" y="13.5" width="3" height="3" fill="#facc15"/>

  <!-- Bonsai Trunk & Branches -->
  <path d="M30 50 C30 43, 28 35, 32 30 C33 28, 36 27, 39 25" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M30 38 C26 36, 23 35, 20 37" stroke="#78350f" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M32 31 C32 26, 30 22, 28 19" stroke="#78350f" stroke-width="2.8" stroke-linecap="round"/>
  
  <!-- Diorama Platform / Pot -->
  <path d="M18 50 L46 50 L43 54 L21 54 Z" fill="#78350f"/>
  <rect x="16" y="48" width="32" height="3" rx="1.5" fill="#a16207"/>

  <!-- Canopy Cloud Clusters -->
  <!-- Top Center Canopy -->
  <ellipse cx="28" cy="18" rx="11" ry="8" fill="url(#green)"/>
  <circle cx="23" cy="16" r="5" fill="#86efac"/>
  
  <!-- Left Canopy -->
  <ellipse cx="19" cy="34" rx="9" ry="6.5" fill="url(#green)"/>
  
  <!-- Right Canopy (Mai Gold Blossom Highlight) -->
  <ellipse cx="41" cy="25" rx="10" ry="7.5" fill="url(#gold)"/>
  <circle cx="43" cy="23" r="3" fill="#fef08a"/>
  
  <!-- Floating seasonal petal dots -->
  <circle cx="14" cy="22" r="1.5" fill="#fde047"/>
  <circle cx="49" cy="38" r="1.8" fill="#4ade80"/>
  <circle cx="36" cy="13" r="1.5" fill="#fef08a"/>
</svg>
